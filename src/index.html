<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Bird</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Add ml5.js from CDN -->
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
</head>
<body>
    <!-- Add an audio test element -->
    <audio id="audioTest" style="display: none"></audio>
    
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- Start/Game Over UI -->
        <div id="game-ui" class="centered-ui">
            <button id="start-btn">Start Game</button>
            <div id="game-over" style="display: none;">
                <h2>Game Over!</h2>
                <div id="final-score">Score: 0</div>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>

        <!-- In-game UI (initially hidden) -->
        <div id="game-stats" style="display: none;">
            <div id="score">Score: 0</div>
            <div id="current-note">Current Note: --</div>
            <div id="target-note">Target Note: --</div>
        </div>
    </div>

    <!-- Load scripts -->
    <script src="./js/audio/PitchDetector.js"></script>
    <script src="./js/audio/HarmonyAnalyzer.js"></script>
    <script src="./js/audio/AudioManager.js"></script>
    <script src="./js/game/Bird.js"></script>
    <script src="./js/game/Obstacle.js"></script>
    <script src="./js/data/SongDatabase.js"></script>
    <script src="./js/game/Game.js"></script>
    
    <script>
        // Wait for all scripts to load
        window.addEventListener('load', async () => {
            console.log('Window loaded, checking electronAPI...');
            
            // Verify electronAPI is available
            if (!window.electronAPI) {
                console.error('electronAPI not found!');
                return;
            }

            // Initialize game
            const game = new Game();
            
            // Add click listener to start button
            const startButton = document.getElementById('start-btn');
            if (startButton) {
                startButton.addEventListener('click', async () => {
                    console.log('Start button clicked');
                    try {
                        // Request microphone access first
                        const stream = await window.electronAPI.requestMicrophone();
                        if (!stream) {
                            throw new Error('No microphone stream received');
                        }
                        console.log('Microphone access granted:', stream);
                        
                        // Start the game with the stream
                        await game.start();
                    } catch (error) {
                        console.error('Failed to start game:', error);
                        alert('Failed to access microphone. Please ensure microphone permissions are granted.');
                    }
                });
            }
        });
    </script>
</body>
</html>
