<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Bird</title>
    <link rel="stylesheet" href="styles/main.css">
    <!-- Add error handling to ml5.js script loading -->
    <script>
        window.addEventListener('error', (event) => {
            if (event.target.src && event.target.src.includes('ml5')) {
                console.error('Failed to load ml5.js:', {
                    src: event.target.src,
                    error: event.error,
                    type: event.type
                });
            }
        }, true);
    </script>
    <!-- Load ml5.js before other scripts -->
    <script 
        src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js" 
        crossorigin="anonymous"
        onload="console.log('ml5.js loaded successfully')"
        onerror="console.error('Failed to load ml5.js')">
    </script>
</head>
<body>
    <!-- Add an audio test element -->
    <audio id="audioTest" style="display: none"></audio>
    
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- Start/Game Over UI -->
        <div id="game-ui" class="centered-ui">
            <button id="start-btn">Start Game</button>
            <div id="game-over" style="display: none;">
                <h2>Game Over!</h2>
                <div id="final-score">Score: 0</div>
                <button id="restart-btn">Play Again</button>
            </div>
        </div>

        <!-- In-game UI (initially hidden) -->
        <div id="game-stats" style="display: none;">
            <div id="score">Score: 0</div>
            <div id="current-note">Current Note: --</div>
            <div id="target-note">Target Note: --</div>
        </div>
    </div>

    <!-- Load scripts -->
    <script src="./js/audio/PitchDetector.js"></script>
    <script src="./js/audio/HarmonyAnalyzer.js"></script>
    <script src="./js/audio/AudioManager.js"></script>
    <script src="./js/game/Bird.js"></script>
    <script src="./js/game/Obstacle.js"></script>
    <script src="./js/data/SongDatabase.js"></script>
    <script src="./js/game/Game.js"></script>
    
    <script>
        // Wait for all scripts to load
        window.addEventListener('load', async () => {
            console.log('Window loaded, checking electronAPI...');
            
            // Wait for ml5.js to be available
            let ml5LoadAttempts = 0;
            while (typeof ml5 === 'undefined' && ml5LoadAttempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 250));
                ml5LoadAttempts++;
            }
            
            if (typeof ml5 === 'undefined') {
                console.error('Failed to load ml5.js after multiple attempts');
                alert('Failed to initialize audio processing. Please refresh the page.');
                return;
            }

            if (!window.electronAPI) {
                console.error('electronAPI not found!');
                return;
            }

            const game = new Game();
            
            const startButton = document.getElementById('start-btn');
            if (startButton) {
                startButton.addEventListener('click', async () => {
                    startButton.disabled = true; // Prevent multiple clicks
                    console.log('Start button clicked');
                    try {
                        const constraints = await window.electronAPI.requestMicrophone();
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        
                        if (!stream || !(stream instanceof MediaStream)) {
                            throw new Error('Invalid microphone stream received');
                        }

                        game.microphoneStream = stream;
                        await game.start();
                    } catch (error) {
                        console.error('Failed to start game:', error);
                        alert('Failed to access microphone. Please ensure microphone permissions are granted.');
                        startButton.disabled = false; // Re-enable button on error
                    }
                });
            }
        });
    </script>
</body>
</html>
